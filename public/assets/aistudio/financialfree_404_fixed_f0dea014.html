<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09251b">
<title>404 • FinancialFree</title>
<style>
:root{color-scheme:dark;--mint:#a8f5ce;--green:#55d99b;--text:#f3fff8;--muted:#b2cfc0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;overflow:hidden;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
background:radial-gradient(ellipse at 50% 10%,#1b5139 0%,#0b2b20 43%,#061810 100%)}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(4px);opacity:.25;animation:float 10s ease-in-out infinite}
.orb.a{width:260px;height:260px;left:-100px;top:8%;background:#69f5b1}
.orb.b{width:320px;height:320px;right:-130px;bottom:-100px;background:#36b98d;animation-delay:-4s}
@keyframes float{50%{transform:translate(25px,-25px) scale(1.08)}}
.grid{position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(#c6ffe0 1px,transparent 1px),linear-gradient(90deg,#c6ffe0 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(#000,transparent 85%)}
.card{position:relative;width:min(100%,510px);padding:30px 26px 25px;text-align:center;border:1px solid #ffffff2b;border-radius:30px;
background:linear-gradient(145deg,#ffffff1c,#ffffff08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
box-shadow:0 28px 80px #0007,inset 0 1px #ffffff30;animation:appear .7s ease both}
@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:750;letter-spacing:.03em}
.brand img{width:54px;height:54px;object-fit:contain;border-radius:15px;background:#fff;padding:3px;box-shadow:0 5px 20px #0003}
.art{height:190px;display:grid;place-items:center;position:relative;margin:8px auto 0}
.ring{position:absolute;width:145px;height:145px;border:1px solid #a8f5ce55;border-radius:50%;animation:ring 3s ease-out infinite}
.ring:nth-child(2){animation-delay:1s}.ring:nth-child(3){animation-delay:2s}
@keyframes ring{0%{transform:scale(.55);opacity:0}25%{opacity:.8}100%{transform:scale(1.6);opacity:0}}
svg{width:190px;height:145px;position:relative;z-index:1;overflow:visible}
.wire{fill:none;stroke:#9cf4c8;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:5 8;animation:flow 1.1s linear infinite;filter:drop-shadow(0 0 4px #55d99b)}
.wire.dim{opacity:.45;animation-duration:1.8s}
@keyframes flow{to{stroke-dashoffset:-26}}
.node{fill:#a8f5ce;stroke:#effff5;stroke-width:2}
.server{fill:#123e2b;stroke:#a8f5ce;stroke-width:2}
.pulse{fill:#64e5a7;filter:drop-shadow(0 0 5px #64e5a7);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.code{font-size:clamp(68px,17vw,88px);font-weight:850;letter-spacing:-.075em;line-height:1;margin:0 0 8px;background:linear-gradient(#fff,#8de7b9);color:transparent;background-clip:text;-webkit-background-clip:text}
h1{font-size:23px;margin:0 0 9px;letter-spacing:-.025em}
.desc{max-width:370px;margin:0 auto;color:var(--muted);font-size:14px;line-height:1.65}
.status{display:inline-flex;align-items:center;gap:9px;margin:20px 0;padding:9px 13px;border:1px solid #ffffff20;border-radius:30px;background:#0002;color:#d5eee0;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#ffc477;box-shadow:0 0 12px #ffc477}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
button,a{font:inherit;text-decoration:none}
.retry{border:0;border-radius:13px;padding:13px 20px;background:linear-gradient(135deg,#b2ffda,#51d99b);color:#073622;font-weight:800;cursor:pointer}
.home{border:1px solid #ffffff30;border-radius:13px;padding:12px 18px;color:#effff6;background:#ffffff0b}
#feedback{min-height:20px;margin:12px 0 0;color:#a8f5ce;font-size:12px}
.footer{margin-top:20px;padding-top:16px;border-top:1px solid #ffffff1c;color:#88aa98;font-size:11px;letter-spacing:.08em}
@media(max-width:420px){.card{padding:24px 18px 20px}.art{height:170px}h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
