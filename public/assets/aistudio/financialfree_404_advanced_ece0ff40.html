<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071c15"><title>404 · FinancialFree</title>
<style>
:root{--mint:#b4ffda;--green:#58e0a0;--muted:#b7d1c4}*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px 16px;color:#f3fff8;font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 8%,#20543d,#103325 42%,#071c15 80%);overflow-x:hidden}
button{font:inherit}.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}.grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#caffdf22 1px,transparent 1px),linear-gradient(90deg,#caffdf22 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(#000,transparent 85%)}
.glow{position:absolute;border-radius:50%;filter:blur(5px);opacity:.25;animation:float 12s ease-in-out infinite}.g1{width:300px;height:300px;left:-130px;top:5%;background:radial-gradient(circle,#71ffc0,transparent 70%)}.g2{width:390px;height:390px;right:-170px;bottom:-130px;background:radial-gradient(circle,#3dc995,transparent 70%);animation-delay:-5s}@keyframes float{50%{transform:translate(22px,-24px) scale(1.08)}}
.card{position:relative;width:min(100%,550px);padding:clamp(24px,5vw,38px);text-align:center;border:1px solid #e7fff32b;border-radius:32px;background:linear-gradient(145deg,#ffffff29,#ffffff0b);backdrop-filter:blur(28px) saturate(155%);-webkit-backdrop-filter:blur(28px) saturate(155%);box-shadow:0 32px 100px #0007,inset 0 1px #ffffff3d;animation:enter .7s ease both}@keyframes enter{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;letter-spacing:.03em}.brand img,.fallback{width:49px;height:49px;border-radius:15px;object-fit:contain;background:#fff;padding:3px;box-shadow:0 6px 24px #0003}.fallback{display:grid;place-items:center;background:linear-gradient(145deg,#baffdc,#42ca91);color:#063d29;font-size:22px}
.visual{height:200px;display:grid;place-items:center;position:relative;margin:10px auto 0}.halo{position:absolute;width:145px;height:145px;border:1px solid #aeffd755;border-radius:50%;animation:halo 3s ease-out infinite}.halo:nth-child(2){animation-delay:1s}.halo:nth-child(3){animation-delay:2s}@keyframes halo{0%{transform:scale(.6);opacity:0}25%{opacity:.8}100%{transform:scale(1.65);opacity:0}}
svg{position:relative;z-index:1;width:220px;height:160px;overflow:visible;filter:drop-shadow(0 8px 24px #39e1972b)}.route{fill:none;stroke:#9af4c5;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:5 9;animation:flow 1.1s linear infinite}.route.alt{opacity:.5;animation-duration:1.8s;animation-direction:reverse}@keyframes flow{to{stroke-dashoffset:-28}}.node{fill:#b4ffda;stroke:#f2fff8;stroke-width:1.8}.server{fill:#093625e6;stroke:#a9f5ce;stroke-width:2}.led{fill:#68e9a9;filter:drop-shadow(0 0 5px #68e9a9);animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.2}}
.code{font-size:clamp(76px,18vw,104px);font-weight:900;letter-spacing:-.085em;line-height:1;background:linear-gradient(#fff,#9cf0c4);color:transparent;background-clip:text;-webkit-background-clip:text}h1{margin:13px 0 10px;font-size:clamp(21px,5vw,25px);letter-spacing:-.03em}.desc{max-width:390px;margin:auto;color:var(--muted);font-size:14px;line-height:1.75}
.status{display:inline-flex;align-items:center;gap:9px;margin:21px 0 19px;padding:10px 14px;border:1px solid #ffffff24;border-radius:99px;background:#0002;color:#d9f4e5;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#ffc477;box-shadow:0 0 12px #ffc477}
.actions{display:flex;justify-content:center;gap:11px;flex-wrap:wrap}.btn{min-height:46px;padding:0 20px;border-radius:14px;border:1px solid #ffffff33;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn:focus-visible{outline:3px solid #c5ffe0;outline-offset:3px}.primary{border:0;color:#063b28;font-weight:800;background:linear-gradient(135deg,#c0ffe0,#53d99c);box-shadow:0 8px 26px #46dc9938}.secondary{color:#f1fff7;background:#ffffff12}.btn:disabled{opacity:.65;cursor:wait;transform:none}
.feedback{min-height:22px;margin:13px 0 0;color:#b9f6d4;font-size:12px;line-height:1.6}.footer{margin-top:23px;padding-top:17px;border-top:1px solid #ffffff20;color:#91b5a1;font-size:10px;letter-spacing:.16em}
@media(max-width:420px){.card{border-radius:27px}.visual{height:180px}.actions{flex-direction:column}.btn{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body>

<script>
/* Configure these routes for your deployment. */
const APP_HOME_URL = "/";
const HEALTH_CHECK_URL = ""; // e.g. "/api/health" (must return HTTP 200)
const $ = id => document.getElementById(id);
const statusEl=$("status"),dot=$("dot"),feedback=$("feedback"),retry=$("retry"),back=$("back");
function setStatus(text,ok){statusEl.textContent=text;dot.style.background=ok?"#64e5a7":"#ffc477";dot.style.boxShadow=ok?"0 0 12px #64e5a7":"0 0 12px #ffc477"}
function updateNetwork(){setStatus(navigator.onLine?"Internet available · Server not verified":"You appear to be offline",navigator.onLine)}
window.addEventListener("online",updateNetwork);window.addEventListener("offline",updateNetwork);
function homeUrl(){return new URL(APP_HOME_URL,location.href)}
async function checkServer(){
 if(!navigator.onLine)throw Error("Offline");
 const target=HEALTH_CHECK_URL||APP_HOME_URL,url=new URL(target,location.href);
 if(url.origin!==location.origin)throw Error("Use a same-origin health endpoint");
 url.searchParams.set("_ff_check",Date.now());
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
 try{const response=await fetch(url.href,{method:"GET",cache:"no-store",credentials:"same-origin",redirect:"follow",signal:controller.signal});if(!response.ok)throw Error("HTTP "+response.status);return true}
 finally{clearTimeout(timer)}
}
retry.addEventListener("click",async()=>{
 if(retry.disabled)return;retry.disabled=true;retry.textContent="Checking connection…";feedback.textContent="Testing internet and FinancialFree server…";setStatus("Contacting app server…",navigator.onLine);
 try{await checkServer();setStatus("FinancialFree server is reachable",true);feedback.textContent="Connected. Opening FinancialFree…";setTimeout(()=>location.assign(homeUrl().href),450)}
 catch(e){setStatus(navigator.onLine?"Server could not be verified":"You appear to be offline",false);feedback.textContent=navigator.onLine?"Internet is available, but the app server did not respond. Please try again.":"Reconnect to the internet, then try again.";retry.disabled=false;retry.textContent="↻  Try again"}
});
back.addEventListener("click",()=>{
 let safe=false;try{safe=!!document.referrer&&new URL(document.referrer).origin===location.origin}catch(e){}
 if(history.length>1&&safe)history.back();else location.assign(homeUrl().href);
});
updateNetwork();
</script></body></html>
